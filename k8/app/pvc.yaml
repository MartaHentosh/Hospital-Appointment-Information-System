apiVersion: v1
kind: PersistentVolume
metadata:
  name: media-pvc
  namespace: hospital
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: static-pvc
  namespace: hospital
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi